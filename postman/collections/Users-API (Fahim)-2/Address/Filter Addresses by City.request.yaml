$kind: http-request
url: "{{base_url}}/posts?userId=1"
method: GET
queryParams:
  userId: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Filter Addresses by City - Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      pm.test('Response is array', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 8000
