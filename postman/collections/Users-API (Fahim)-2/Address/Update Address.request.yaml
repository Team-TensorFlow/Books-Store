$kind: http-request
url: "{{base_url}}/posts/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "label": "Home",
      "street": "Road 5",
      "city": "Dhaka"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Update Address - Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      pm.test('Response is object', function () { pm.expect(pm.response.json()).to.be.an('object'); });
    language: text/javascript
order: 4000
