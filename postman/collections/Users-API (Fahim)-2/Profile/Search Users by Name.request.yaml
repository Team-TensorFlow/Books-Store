$kind: http-request
url: "{{base_url}}/users?username=Bret"
method: GET
queryParams:
  username: Bret
scripts:
  - type: afterResponse
    code: |-
      pm.test('Search Users by Name - Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      pm.test('Response is array', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 8000
