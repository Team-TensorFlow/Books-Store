$kind: http-request
url: "{{base_url}}/users/1"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Update User Role - Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      pm.test('Response is object', function () { pm.expect(pm.response.json()).to.be.an('object'); });
    language: text/javascript
order: 1000
