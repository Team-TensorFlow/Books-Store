$kind: http-request
url: "{{base_url}}/users/1/todos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Get Active Sessions - Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      pm.test('Response is array', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 1000
