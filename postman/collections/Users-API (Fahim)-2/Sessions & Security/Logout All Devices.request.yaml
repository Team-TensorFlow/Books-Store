$kind: http-request
url: "{{base_url}}/todos/1"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout All Devices - Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      pm.test('Response is object', function () { pm.expect(pm.response.json()).to.be.an('object'); });
    language: text/javascript
order: 3000
