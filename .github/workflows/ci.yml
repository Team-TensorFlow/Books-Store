name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Newman API Tests
        run: |
          # Start Express app in background
          node app.js &
          
          # Wait 5 seconds for Express server to boot
          sleep 5
          
          # Execute Newman using collection.json and the environment file
          npx newman run postman/collection.json -e "postman/environments/Books-Store Server.environment.yaml"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Clone repo if missing, or pull latest changes
            if [ ! -d "Books-Store" ]; then
              git clone https://github.com/Team-TensorFlow/Books-Store.git
            fi
            
            cd Books-Store
            git pull origin main

            # Rebuild image and restart container on Port 80
            docker build -t ju-cse-app .
            docker stop ju-cse-container || true
            docker rm ju-cse-container || true
            docker run -d -p 80:3000 --restart always --name ju-cse-container ju-cse-app
            docker image prune -f