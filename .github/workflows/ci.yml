name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Newman API Tests
        run: |
          # Start Express app in background
          node app.js &
          
          # Wait 3 seconds for Express to boot
          sleep 3
          
          # Use npx to execute Newman cleanly
          npx newman run postman/collection.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d "web-ii-team-project" ]; then
              git clone https://github.com/Abdullah-Al-Faheem/web-ii-team-project.git
            fi
            
            cd web-ii-team-project
            git pull origin main

            docker build -t ju-cse-app .
            docker stop ju-cse-container || true
            docker rm ju-cse-container || true
            docker run -d -p 80:3000 --restart always --name ju-cse-container ju-cse-app
            docker image prune -f