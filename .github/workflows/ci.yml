name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Newman API Tests
        run: |
          npx newman run demo.json


  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d "Books-Store" ]; then
              git clone https://github.com/Team-TensorFlow/Books-Store.git
            fi
            
            cd Books-Store
            git pull origin main

            # Stop and remove any old single containers if they exist
            docker stop ju-cse-container || true
            docker rm ju-cse-container || true
            
            # Use docker compose OR docker-compose depending on what is installed on the VPS
            if command -v docker-compose &> /dev/null; then
              DOCKER_CMD="docker-compose"
            else
              DOCKER_CMD="docker compose"
            fi
            
            $DOCKER_CMD down || true
            $DOCKER_CMD up -d --build
            
            docker image prune -f