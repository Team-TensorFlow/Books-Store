name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            # Auto-install docker-compose if neither version exists
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              apt-get update -y || true
              apt-get install -y docker-compose || true
            fi
            
            if [ ! -d "Books-Store" ]; then
              git clone https://github.com/Team-TensorFlow/Books-Store.git
            fi
            
            cd Books-Store
            git pull origin main

            # Stop and remove any old single containers if they exist
            docker stop ju-cse-container || true
            docker rm ju-cse-container || true
            
            # Run the appropriate compose command without variable splitting
            if command -v docker-compose &> /dev/null; then
              docker-compose down || true
              docker-compose up -d --build
            else
              docker compose down || true
              docker compose up -d --build
            fi
            
            docker image prune -f
