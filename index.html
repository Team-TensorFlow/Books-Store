<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Store Remote Interface</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #1e1e2e; color: #fff; }
    .card { background: #2b2b3b; padding: 20px; border-radius: 8px; margin-bottom: 20px; max-width: 500px; }
    input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; border-radius: 4px; border: none; }
    button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    pre { background: #111; padding: 15px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>JU CSE Book Store Client</h2>

  <!-- Login Card -->
  <div class="card">
    <h3>Login</h3>
    <input id="email" type="email" placeholder="Email" value="naeem@example.com">
    <input id="password" type="password" placeholder="Password" value="password123">
    <button onclick="login()">Log In</button>
  </div>

  <!-- API Action Card -->
  <div class="card">
    <h3>Protected Actions</h3>
    <button onclick="getUsers()">Get All Users (Admin Only)</button>
    <button onclick="getBooks()">Get All Books (Public)</button>
    <button onclick="logout()">Log Out</button>
  </div>

  <div class="card">
    <h3>API Output</h3>
    <pre id="output">No request sent yet.</pre>
  </div>

  <script>
    const API_URL = "http://localhost:3000/api";

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_URL}/users/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.token) {
          localStorage.setItem('jwtToken', data.token);
          document.getElementById('output').innerText = "Logged in successfully!\nToken Saved.";
        } else {
          document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        }
      } catch (err) {
        document.getElementById('output').innerText = "Connection error: " + err.message;
      }
    }

    async function getUsers() {
      const token = localStorage.getItem('jwtToken');
      try {
        const res = await fetch(`${API_URL}/users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('output').innerText = "Error: " + err.message;
      }
    }

    async function getBooks() {
      try {
        const res = await fetch(`${API_URL}/books`);
        const data = await res.json();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('output').innerText = "Error: " + err.message;
      }
    }

    function logout() {
      localStorage.removeItem('jwtToken');
      document.getElementById('output').innerText = "Logged out successfully.";
    }
  </script>
</body>
</html>
